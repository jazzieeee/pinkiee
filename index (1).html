<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinkis App</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e91e8c">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #fce4ec; min-height: 100vh; }

    /* HEADER */
    header {
      background: #e91e8c;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    header h1 { font-size: 1.4rem; }
    header p { font-size: 12px; opacity: 0.85; margin-top: 3px; }

    /* AUTH SCREEN */
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      padding: 1rem;
    }
    .auth-card {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 2px 12px rgba(233,30,140,0.15);
    }
    .auth-card h2 {
      color: #e91e8c;
      font-size: 1.2rem;
      margin-bottom: 1.2rem;
      text-align: center;
    }
    .auth-card input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #f8bbd0;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 10px;
      outline: none;
    }
    .auth-card input:focus { border-color: #e91e8c; }
    .btn-pink {
      width: 100%;
      background: #e91e8c;
      color: white;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-pink:active { background: #c2185b; }
    .btn-outline {
      width: 100%;
      background: transparent;
      color: #e91e8c;
      border: 1px solid #e91e8c;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }
    .toggle-text {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-top: 14px;
    }
    .toggle-text span {
      color: #e91e8c;
      cursor: pointer;
      font-weight: 500;
    }
    #auth-error {
      color: #c62828;
      font-size: 12px;
      text-align: center;
      margin-top: 8px;
      min-height: 18px;
    }

    /* APP SCREEN */
    #app-screen { display: none; }
    .top-bar {
      background: #e91e8c;
      color: white;
      padding: 0.6rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .btn-logout {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .container { padding: 1rem; max-width: 500px; margin: auto; }
    .input-row { display: flex; gap: 8px; margin-bottom: 1rem; }
    .input-row input {
      flex: 1;
      padding: 10px;
      border: 1px solid #f8bbd0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .input-row input:focus { border-color: #e91e8c; }
    .btn-add {
      background: #e91e8c;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
    }
    .nota {
      background: white;
      border-left: 4px solid #e91e8c;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 14px;
      box-shadow: 0 1px 4px rgba(233,30,140,0.1);
    }
    .nota .meta {
      color: #aaa;
      font-size: 11px;
      margin-top: 4px;
    }
    #empty-msg {
      text-align: center;
      color: #ccc;
      margin-top: 2rem;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌸 Pinkis App</h1>
    <p>PWA con Firebase Authentication + Realtime Database</p>
  </header>

  <!-- PANTALLA DE LOGIN -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2 id="auth-title">Iniciar sesión</h2>
      <input type="email" id="email" placeholder="Correo electrónico" />
      <input type="password" id="password" placeholder="Contraseña" />
      <button class="btn-pink" id="btn-action">Entrar</button>
      <button class="btn-outline" id="btn-toggle-mode">Crear cuenta nueva</button>
      <p id="auth-error"></p>
      <p class="toggle-text" id="toggle-hint">
        ¿No tienes cuenta? <span id="toggle-link">Regístrate</span>
      </p>
    </div>
  </div>

  <!-- PANTALLA PRINCIPAL -->
  <div id="app-screen">
    <div class="top-bar">
      <span id="user-email">usuario</span>
      <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
    </div>
    <div class="container">
      <div class="input-row">
        <input type="text" id="nuevaNota" placeholder="Escribe una nota..." />
        <button class="btn-add" id="btnAgregar">+</button>
      </div>
      <div id="notas"></div>
      <p id="empty-msg">Aún no hay notas. ¡Agrega la primera!</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, push, onValue }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBS1KPR5kXj4vuGxF3OX0EFbcFjU3FtSKk",
      authDomain: "pinkiee.firebaseapp.com",
      databaseURL: "https://pinkiee-default-rtdb.firebaseio.com",
      projectId: "pinkiee",
      storageBucket: "pinkiee.firebasestorage.app",
      messagingSenderId: "248170622035",
      appId: "1:248170622035:web:af5078ae83c341f5ab2aa6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // --- UI ELEMENTS ---
    const authScreen = document.getElementById('auth-screen');
    const appScreen = document.getElementById('app-screen');
    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');
    const authTitle = document.getElementById('auth-title');
    const btnAction = document.getElementById('btn-action');
    const btnToggle = document.getElementById('btn-toggle-mode');
    const toggleLink = document.getElementById('toggle-link');
    const authError = document.getElementById('auth-error');
    const userEmailSpan = document.getElementById('user-email');
    const emptyMsg = document.getElementById('empty-msg');

    let isLoginMode = true;

    // Cambiar entre login y registro
    function toggleMode() {
      isLoginMode = !isLoginMode;
      authTitle.textContent = isLoginMode ? 'Iniciar sesión' : 'Crear cuenta';
      btnAction.textContent = isLoginMode ? 'Entrar' : 'Registrarse';
      btnToggle.textContent = isLoginMode ? 'Crear cuenta nueva' : 'Ya tengo cuenta';
      toggleLink.textContent = isLoginMode ? 'Regístrate' : 'Inicia sesión';
      authError.textContent = '';
    }

    btnToggle.addEventListener('click', toggleMode);
    toggleLink.addEventListener('click', toggleMode);

    // Acción principal (login o registro)
    btnAction.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const pass = passInput.value.trim();
      authError.textContent = '';
      if (!email || !pass) { authError.textContent = 'Llena todos los campos'; return; }
      try {
        if (isLoginMode) {
          await signInWithEmailAndPassword(auth, email, pass);
        } else {
          await createUserWithEmailAndPassword(auth, email, pass);
        }
      } catch (err) {
        const msgs = {
          'auth/invalid-email': 'Correo inválido',
          'auth/user-not-found': 'Usuario no encontrado',
          'auth/wrong-password': 'Contraseña incorrecta',
          'auth/email-already-in-use': 'Ese correo ya está registrado',
          'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres',
          'auth/invalid-credential': 'Correo o contraseña incorrectos'
        };
        authError.textContent = msgs[err.code] || 'Error: ' + err.message;
      }
    });

    // Cerrar sesión
    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    // Detectar estado de sesión
    onAuthStateChanged(auth, user => {
      if (user) {
        authScreen.style.display = 'none';
        appScreen.style.display = 'block';
        userEmailSpan.textContent = user.email;
        cargarNotas(user.uid);
      } else {
        authScreen.style.display = 'flex';
        appScreen.style.display = 'none';
      }
    });

    // Cargar notas del usuario
    function cargarNotas(uid) {
      const notasRef = ref(db, 'notas/' + uid);
      onValue(notasRef, snapshot => {
        const div = document.getElementById('notas');
        div.innerHTML = '';
        const data = snapshot.val();
        if (data) {
          emptyMsg.style.display = 'none';
          Object.values(data).reverse().forEach(nota => {
            div.innerHTML += `<div class="nota">${nota.texto}<div class="meta">${nota.fecha}</div></div>`;
          });
        } else {
          emptyMsg.style.display = 'block';
        }
      });

      document.getElementById('btnAgregar').addEventListener('click', () => agregarNota(uid));
      document.getElementById('nuevaNota').addEventListener('keydown', e => {
        if (e.key === 'Enter') agregarNota(uid);
      });
    }

    function agregarNota(uid) {
      const input = document.getElementById('nuevaNota');
      const texto = input.value.trim();
      if (!texto) return;
      push(ref(db, 'notas/' + uid), { texto, fecha: new Date().toLocaleString('es-MX') });
      input.value = '';
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('✅ SW registrado'))
        .catch(e => console.log('SW error:', e));
    }
  </script>

</body>
</html>
